<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Apple of Fortune</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
    body { background: radial-gradient(circle at center, #173b2b, #091910); min-height: 100vh; display: flex; justify-content: center; color: #fff; }
    .game-screen { width: 100%; max-width: 430px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; min-height: 100vh; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.45); padding: 8px 12px; border-radius: 10px; font-size: 0.9rem; }
    .wallet { font-weight: 800; color: #fbbf24; }
    .status-badge { color: #38bdf8; font-weight: bold; font-size: 0.8rem; }
    
    .board-container { display: flex; flex-direction: column-reverse; gap: 5px; margin: 6px 0; }
    .row { display: flex; align-items: center; gap: 5px; direction: ltr; opacity: 0.35; pointer-events: none; transition: opacity 0.2s ease; }
    .row.active { opacity: 1; pointer-events: all; }
    .row.cleared { opacity: 0.85; pointer-events: none; }
    
    .cells-wrap { display: flex; gap: 5px; flex: 1; }
    .cell { flex: 1; aspect-ratio: 1; background: radial-gradient(circle at 35% 35%, #96572a, #522d11); border: 2px solid #3d1f0a; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.35rem; cursor: pointer; box-shadow: inset 0 -2px 4px rgba(0,0,0,0.5); }
    .cell.good { background: radial-gradient(circle at 35% 35%, #2ecc71, #145a32); border-color: #27ae60; box-shadow: 0 0 8px #2ecc71; }
    .cell.bad { background: radial-gradient(circle at 35% 35%, #e74c3c, #78281f); border-color: #c0392b; box-shadow: 0 0 8px #e74c3c; }
    
    .multiplier-badge { width: 60px; background: #1b3d2b; color: #6ee7b7; text-align: center; padding: 6px 0; border-radius: 6px; font-size: 0.8rem; font-weight: 800; }
    
    .controls-panel { background: #112219; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; border: 1px solid rgba(255,255,255,0.06); }
    .status-alert { text-align: center; font-size: 0.85rem; font-weight: bold; min-height: 20px; color: #a7f3d0; }
    .btn-action { padding: 12px; border-radius: 8px; border: none; font-size: 1rem; font-weight: 900; cursor: pointer; color: #fff; }
    .btn-action.start { background: #10b981; }
    .btn-action.cashout { background: #f59e0b; color: #000; }
  </style>
</head>
<body>

  <div class="game-screen">
    <div class="top-bar">
      <div class="wallet">الرصيد: <span id="userBalance">1000.00</span> ج.م</div>
      <div class="status-badge" id="syncStatus">● جاهز للمزامنة</div>
    </div>

    <div class="board-container" id="gameGrid"></div>

    <div class="controls-panel">
      <div class="status-alert" id="statusMessage">اضغط START في الاسكربت ثم ابدأ هنا</div>
      <button class="btn-action start" id="mainGameBtn" onclick="onMainActionClick()">ابدأ الرهان (20 ج.م)</button>
    </div>
  </div>

  <script>
    const LEVELS = [
      { mult: 1.23, bad: 1 },
      { mult: 1.54, bad: 1 },
      { mult: 1.93, bad: 1 },
      { mult: 2.41, bad: 1 },
      { mult: 4.02, bad: 2 },
      { mult: 6.71, bad: 2 },
      { mult: 11.18, bad: 2 },
      { mult: 27.97, bad: 3 },
      { mult: 69.93, bad: 3 },
      { mult: 349.68, bad: 4 }
    ];

    let userMoney = 1000.00;
    let currentRowIndex = 0;
    let isPlaying = false;
    let currentStake = 20;
    let syncedMatrix = null;

    // استقبال المصفوفة من الاسكربت لحظياً
    const syncChannel = new BroadcastChannel('shared_apple_system');
    syncChannel.onmessage = (event) => {
      if (event.data && event.data.type === 'NEW_ROUND') {
        syncedMatrix = event.data.matrix;
        document.getElementById('syncStatus').innerText = "● تم الربط مع الاسكربت بنجاح!";
        document.getElementById('syncStatus').style.color = "#4ade80";
      } else if (event.data && event.data.type === 'RESET_ROUND') {
        resetGame();
      }
    };

    function renderBoard() {
      const grid = document.getElementById('gameGrid');
      grid.innerHTML = '';
      LEVELS.forEach((lvl, rIdx) => {
        const row = document.createElement('div');
        row.className = 'row';
        row.id = `gm-row-${rIdx}`;

        const cellsWrap = document.createElement('div');
        cellsWrap.className = 'cells-wrap';
        for (let cIdx = 0; cIdx < 5; cIdx++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.onclick = () => onSelectApple(rIdx, cIdx);
          cellsWrap.appendChild(cell);
        }

        const badge = document.createElement('div');
        badge.className = 'multiplier-badge';
        badge.innerText = `x${lvl.mult}`;

        row.appendChild(cellsWrap);
        row.appendChild(badge);
        grid.appendChild(row);
      });
    }

    function onMainActionClick() {
      const btn = document.getElementById('mainGameBtn');
      if (!isPlaying) {
        // التحقق من وجود مصفوفة مستلمة من الاسكربت أو قراءتها من الذاكرة
        if (!syncedMatrix) {
          const saved = localStorage.getItem('shared_apple_matrix');
          if (saved) syncedMatrix = JSON.parse(saved);
        }

        if (!syncedMatrix) {
          alert("من فضلك اضغط على زر START في الاسكربت أولاً!");
          return;
        }

        userMoney -= currentStake;
        document.getElementById('userBalance').innerText = userMoney.toFixed(2);
        
        isPlaying = true;
        currentRowIndex = 0;
        renderBoard();

        document.getElementById(`gm-row-0`).classList.add('active');
        btn.innerText = "سحب الأرباح (0 ج.م)";
        btn.className = "btn-action cashout";
        btn.disabled = true;
        document.getElementById('statusMessage').innerText = "اختر التفاحة الخضراء الظاهرة في الاسكربت";
      } else {
        const profit = currentStake * LEVELS[currentRowIndex - 1].mult;
        userMoney += profit;
        document.getElementById('userBalance').innerText = userMoney.toFixed(2);
        document.getElementById('statusMessage').innerText = `مبروك! تم سحب ${profit.toFixed(2)} ج.م 🎉`;
        resetGame();
      }
    }

    function onSelectApple(rIdx, cIdx) {
      if (!isPlaying || rIdx !== currentRowIndex) return;

      const rowEl = document.getElementById(`gm-row-${rIdx}`);
      const cellEl = rowEl.querySelectorAll('.cell')[cIdx];
      const isGood = syncedMatrix[rIdx][cIdx];

      if (isGood) {
        cellEl.innerText = "🍏";
        cellEl.classList.add('good');
        rowEl.classList.remove('active');
        rowEl.classList.add('cleared');

        const btn = document.getElementById('mainGameBtn');
        btn.disabled = false;
        btn.innerText = `سحب الأرباح (${(currentStake * LEVELS[currentRowIndex].mult).toFixed(2)} ج.م)`;

        currentRowIndex++;
        if (currentRowIndex >= LEVELS.length) {
          onMainActionClick();
        } else {
          document.getElementById(`gm-row-${currentRowIndex}`).classList.add('active');
          document.getElementById('statusMessage').innerText = `انتقل للصف ${currentRowIndex + 1}`;
        }
      } else {
        cellEl.innerText = "🍎";
        cellEl.classList.add('bad');
        syncedMatrix[rIdx].forEach((val, i) => {
          const c = rowEl.querySelectorAll('.cell')[i];
          c.innerText = val ? "🍏" : "🍎";
          c.classList.add(val ? 'good' : 'bad');
        });
        document.getElementById('statusMessage').innerText = "تفاحة فاسدة!";
        resetGame();
      }
    }

    function resetGame() {
      isPlaying = false;
      const btn = document.getElementById('mainGameBtn');
      btn.innerText = "ابدأ الرهان (20 ج.م)";
      btn.className = "btn-action start";
      btn.disabled = false;
      document.querySelectorAll('.row').forEach(r => r.classList.remove('active'));
    }

    renderBoard();
  </script>
</body>
</html>
